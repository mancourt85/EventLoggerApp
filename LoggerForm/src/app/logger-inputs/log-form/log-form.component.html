<div class="log-form-container">
  <!-- Log Submission Form -->
  <form [formGroup]="logForm" (ngSubmit)="onSubmit()" class="log-form-inputs">

    <!-- Message Input -->
    <div>
      <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
      <input id="message" formControlName="message" type="text"
             class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"/>
    </div>

    <!-- Level Selector -->
    <div>
      <label for="level" class="block text-sm font-medium text-gray-700">Level</label>
      <select id="level" formControlName="level"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
        <option value="Info">Info</option>
        <option value="Warning">Warning</option>
        <option value="Error">Error</option>
      </select>
    </div>

    <!-- Date Selector (manual input, expected format YYYY-MM-DD) -->
    <div>
      <label for="dateEvent" class="block text-sm font-medium text-gray-700">Date (YYYY-MM-DD)</label>
      <input id="dateEvent" formControlName="dateEvent" type="text"
             placeholder="Enter date as YYYY-MM-DD"
             class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"/>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="log-form-button">
      Submit
    </button>

    <!-- Success Message -->
    <div *ngIf="success" class="log-form-success">Log submitted successfully!</div>
  </form>

  <!-- Submitted Logs Display -->
  <div *ngIf="logs.length > 0" class="submitted-logs">
    <h2 class="text-lg font-semibold mb-4">Submitted Logs:</h2>
    <ul class="space-y-2">
      <li *ngFor="let log of logs" class="submitted-log-item">
        <p><strong class="submitted-log-title">Message:</strong> {{ log.content }}</p>
        <p><strong class="submitted-log-title">Level:</strong> {{ log.logType }}</p>
        <p><strong class="submitted-log-title">Time:</strong> {{ log.dateEvent | date:'short' }}</p>
      </li>
    </ul>
  </div>

  <!-- View Logs Link -->
  <div class="view-logs-link">
    <a routerLink="/view-logs" class="hover:text-blue-800">View All Logs</a>
  </div>
</div>
